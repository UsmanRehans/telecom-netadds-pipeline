name: Refresh metrics

on:
  schedule:
    # Carriers file 10-Qs in late Jan/Apr/Jul/Oct; run weekly and let the
    # idempotent upserts make the no-new-filings case a no-op.
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: python -m pipeline.run load --schema
